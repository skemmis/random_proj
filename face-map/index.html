const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const face = new Image(); face.src = 'face.webp'; face.onload = () => request();
const codesImg = new Image(); codesImg.src = D.codesPng; codesImg.onload = () => { layersKey = ''; request(); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// one full-resolution layer per category, painted from the coded image (0.5 mm per pixel)
const layers = {}; let layersKey = '';
function buildLayers(colors) {
  const key = CATS.map(k => colors[k]).join();
  if (key === layersKey || !codesImg.complete || !codesImg.naturalWidth) return;
  const W = codesImg.naturalWidth, tmp = document.createElement('canvas'); tmp.width = tmp.height = W;
  const t = tmp.getContext('2d'); t.drawImage(codesImg, 0, 0);
  const src = t.getImageData(0, 0, W, W).data;
  const R = D.radiusMM / D.mmPerPx, c0 = (W - 1) / 2;
  for (const k of CATS) {
    const ci = CATS.indexOf(k), cvs = document.createElement('canvas'); cvs.width = cvs.height = W;
    const lc = cvs.getContext('2d'), im = lc.createImageData(W, W), rgb = toRGB(colors[k]);
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (D.catOfCode[src[i * 4]] !== ci || (x - c0) ** 2 + (y - c0) ** 2 > R * R) continue;
      im.data[i * 4] = rgb[0]; im.data[i * 4 + 1] = rgb[1]; im.data[i * 4 + 2] = rgb[2]; im.data[i * 4 + 3] = 255;
    }
    lc.putImageData(im, 0, 0); layers[k] = cvs;
  }
  layersKey = key;
}
function toRGB(c) {
  if (c.startsWith('#')) { const h = c.slice(1); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
  return (c.match(/\d+/g) || [0, 0, 0]).slice(0, 3).map(Number);
}

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (p, a, b) => clamp((p - a) / (b - a));
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

// where things sit, in CSS pixels, at the start (sight alone) and at the end (small sight and the pie)
function layout(w, h) {
  if (w / h > 1.1) {
    const r = Math.min(h * 0.45, w * 0.3), x = Math.max(w * 0.62, w - r - 56), left = Math.max(32, w * 0.06);
    return { s: { x, y: h / 2, r }, pie: { x, y: h / 2, r: r * 0.78 }, cap: { left, width: Math.min(x - r - 56 - left, 420), top: h / 2, mid: true } };
  }
  const r = Math.min(w * 0.46, h * 0.3), y = h * 0.4;
  return { s: { x: w / 2, y, r }, pie: { x: w / 2, y, r: r * 0.78 }, cap: { left: 20, width: w - 40, top: y + r * 1.1 + 28, mid: false } };
}

// the scroll's beats, as fractions of the section's scroll
const B = { miss: [0.13, 0.17, 0.22, 0.25], kill: [0.22, 0.26, 0.31, 0.34], ear: [0.31, 0.35, 0.40, 0.43], graze: [0.40, 0.44, 0.46, 0.47], all: [0.46, 0.5], fly: [0.52, 0.80], pie: [0.80, 0.85] };
const CAPS = [['capA', -1, 0, 0.11, 0.13], ['capMiss', 0.13, 0.15, 0.2, 0.22], ['capKill', 0.22, 0.24, 0.29, 0.31], ['capEar', 0.31, 0.33, 0.38, 0.40],
              ['capGraze', 0.40, 0.42, 0.47, 0.49], ['capPie', 0.83, 0.86, 0.95, 0.98]];

function progress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? clamp(scrollY / max) : 0;
}

let raf = 0; function request() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

function draw() {
  const p = progress();
  const dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const colors = Object.fromEntries(CATS.map(k => [k, css(COLOR_VAR[k])]));
  buildLayers(colors);
  const L = layout(w, h);

  // captions
  for (const [id, a, b, c, d] of CAPS) {
    const o = Math.min(a < 0 ? 1 : ramp(p, a, b), 1 - ramp(p, c, d));
    document.getElementById(id).style.opacity = o.toFixed(3);
  }
  // captions sit on the black housing, beside the lens or below it
  for (const [id] of CAPS) { const s = document.getElementById(id).style; s.left = L.cap.left + 'px'; s.width = L.cap.width + 'px'; s.top = L.cap.top + 'px'; s.transform = L.cap.mid ? 'translateY(-50%)' : 'none'; s.textAlign = L.cap.mid ? 'left' : 'center'; }

  // the sight moves aside while the colours fly
  const fly = ramp(p, B.fly[0], B.fly[1]), gone = ramp(p, B.fly[0] + 0.02, B.fly[0] + 0.12);  // the lens empties as the colours leave
  const S = L.s;
  const k = S.r / D.radiusMM;  // px per mm

  // the zones light one at a time; while one is new, the others step back so it stands out
  // one zone at a time; all four together only just before they fly
  const one = b => Math.max(Math.min(ramp(p, b[0], b[1]), 1 - ramp(p, b[2], b[3])), ramp(p, ...B.all));
  const lit = { miss: one(B.miss), serious: one(B.kill), ear: one(B.ear), graze: one(B.graze) };
  const focus = null;
  const leave = ramp(p, B.fly[0], B.fly[0] + 0.02);  // the painted zones hand over to the flying cells

  // lens, face and zones
  ctx.save(); ctx.beginPath(); ctx.arc(S.x, S.y, S.r, 0, 2 * Math.PI); ctx.clip();
  ctx.fillStyle = css('--bg'); ctx.fillRect(S.x - S.r, S.y - S.r, 2 * S.r, 2 * S.r);
  ctx.globalAlpha = 1 - gone; ctx.fillStyle = css('--lens'); ctx.fillRect(S.x - S.r, S.y - S.r, 2 * S.r, 2 * S.r);
  const span = (D.halfMM + D.mmPerPx / 2) * k;  // the face still and the coded image share one frame, centred on the aim point
  if (face.complete && face.naturalWidth) ctx.drawImage(face, S.x - span, S.y - span, 2 * span, 2 * span);
  if (layersKey) {
    ctx.imageSmoothingEnabled = true;
    for (const c of ['miss', 'serious', 'ear', 'graze']) {
      let a = lit[c] * 0.85 * (1 - leave) * (1 - gone);
      if (focus && focus !== c) a *= 0.45;
      if (c === 'miss') a = Math.min(1, a * 1.1);
      if (a <= 0) continue;
      ctx.globalAlpha = a; ctx.drawImage(layers[c], S.x - span, S.y - span, 2 * span, 2 * span);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (gone < 1) { ctx.globalAlpha = 1 - gone; drawTube(S, 1 - ramp(p, B.miss[0], B.miss[1])); ctx.globalAlpha = 1; }

  // the flight: each cell leaves the face for its place in the pie
  if (fly > 0) {
    const P = L.pie, cell = D.cellMM * k, dot = P.r * Math.sqrt(Math.PI / cells.length) * 1.02;
    const ex = explode(P);
    const crisp = ramp(p, ...B.pie);
    const by = { miss: [], serious: [], graze: [], ear: [] };
    for (const q of particles) {
      const t = ease(clamp((fly - q.d) / 0.48));
      if (t <= 0 && leave < 1) continue;
      let x0 = S.x + q.u * k, y0 = S.y - q.v * k;
      let x1 = P.x + q.x * P.r, y1 = P.y + q.y * P.r;
      if (q.k === 'ear') { x1 += ex.x; y1 += ex.y; }
      const dx = x1 - x0, dy = y1 - y0, b = Math.sin(Math.PI * t) * q.bend;
      by[q.k].push(lerp(x0, x1, t) - dy * b, lerp(y0, y1, t) + dx * b, lerp(cell, dot, t));
    }
    ctx.globalAlpha = 1 - crisp;
    for (const c of ['miss', 'serious', 'graze', 'ear']) {
      const a = by[c]; if (!a.length) continue;
      ctx.fillStyle = colors[c]; ctx.beginPath();
      for (let i = 0; i < a.length; i += 3) { const s = a[i + 2]; ctx.rect(a[i] - s / 2, a[i + 1] - s / 2, s, s); }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (crisp > 0) drawPie(P, colors, crisp, L);
  }
}

function explode(P) { const s = slices[0]; return { x: Math.sin(s.mid) * P.r * 0.09, y: -Math.cos(s.mid) * P.r * 0.09 }; }

// Crooks's red-dot sight (Sam, 2026-10-14): a black tube around a round lens, a glowing red dot at the aim point
function drawTube(S, dotAlpha) {
  const t = Math.max(8, S.r * 0.075), TAU = 2 * Math.PI;
  ctx.save();
  ctx.strokeStyle = '#2a2b2d'; ctx.lineWidth = t; ctx.beginPath(); ctx.arc(S.x, S.y, S.r + t / 2, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = Math.max(1, t * 0.14); ctx.beginPath(); ctx.arc(S.x, S.y, S.r + t * 0.55, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
  const g = ctx.createRadialGradient(S.x, S.y, S.r * 0.8, S.x, S.y, S.r); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.16)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(S.x, S.y, S.r, 0, TAU); ctx.fill();
  if (dotAlpha > 0) {
    const d = Math.max(2.5, S.r * 0.018);
    ctx.globalAlpha = dotAlpha; ctx.shadowColor = 'rgba(255,40,30,.9)'; ctx.shadowBlur = d * 3;
    ctx.strokeStyle = 'rgba(255,45,35,.65)'; ctx.lineWidth = Math.max(1.2, d * 0.4); ctx.beginPath(); ctx.arc(S.x, S.y, d * 6, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#ff2b1f'; ctx.beginPath(); ctx.arc(S.x, S.y, d, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// the finished pie, with its labels set directly on or beside each slice
function drawPie(P, colors, a, L) {
  const ex = explode(P), bg = css('--bg');
  ctx.save(); ctx.globalAlpha = a;
  for (const s of slices) {
    const o = s.k === 'ear' ? ex : { x: 0, y: 0 };
    ctx.beginPath(); ctx.moveTo(P.x + o.x, P.y + o.y);
    ctx.arc(P.x + o.x, P.y + o.y, P.r, s.a0 - Math.PI / 2, s.a1 - Math.PI / 2); ctx.closePath();
    ctx.fillStyle = colors[s.k === 'serious' ? 'serious' : s.k]; ctx.fill();
    ctx.strokeStyle = bg; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  }
  const fs = Math.max(15, Math.min(19, P.r * 0.085)), head = css('--font-head');
  const lab = (lines, x, y, align, color, bold) => {
    ctx.textAlign = align; ctx.fillStyle = color;
    lines.forEach((ln, i) => { ctx.font = `${i === lines.length - 1 && bold ? 700 : 600} ${fs}px ${head}`; ctx.fillText(ln, x, y + i * fs * 1.2); });
  };
  // every slice labelled (Sam, 2026-10-16): the two big slices inside, the two thin ones above, ear to the left, graze to the right
  const at = (s, rr, o = { x: 0, y: 0 }) => ({ x: P.x + o.x + Math.sin(s.mid) * rr, y: P.y + o.y - Math.cos(s.mid) * rr });
  const sl = Object.fromEntries(slices.map(s => [s.k, s]));
  { const c = at(sl.miss, P.r * 0.52); lab([CONTENT.slices.miss, Q.miss_share_of_circle], c.x, c.y - fs * 0.2, 'center', css('--on-fill'), true); }
  { const c = at(sl.serious, P.r * 0.55), t = (P.r > 170 ? CONTENT.slices.serious : CONTENT.slices.seriousShort).split('\n');
    lab([...t, Q.serious_share_of_circle], c.x, c.y - fs * 0.6 * t.length, 'center', css('--on-fill'), true); }
  ctx.strokeStyle = css('--leader'); ctx.lineWidth = 1;
  const top = P.y - P.r - Math.max(30, P.r * 0.16), dx = Math.max(34, P.r * 0.22);
  for (const [s, o, name, val, side] of [[sl.ear, ex, CONTENT.slices.ear, Q.ear_share_of_circle, -1], [sl.graze, { x: 0, y: 0 }, CONTENT.slices.graze, Q.graze_share_of_circle, 1]]) {
    const t = at(s, P.r + 4, o), x = P.x + side * dx;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x, top + 6); ctx.lineTo(x + side * 6, top + 6); ctx.stroke();
    lab([name + ' ' + val], x + side * 10, top + 6 + fs * 0.35, side < 0 ? 'right' : 'left', css('--ink'), true);
  }
  ctx.restore();
}

addEventListener('scroll', request, { passive: true });
addEventListener('resize', request);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { layersKey = ''; request(); });
document.fonts && document.fonts.ready.then(request);
request();

Spine.register({ kind: 'scroll', enter: request, leave() {} });
</script>
