<title>The Loop Hypothesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,500;0,700;0,800;0,900;1,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* A film, not a page: every scene fills the screen and snaps into place. Videos run edge to edge;
   type sits on the footage. A clock-radio HUD counts the days as you scroll. Single dark world by choice. */
:root {
  --black: #070707; --white: #f6f4ef; --dim: rgba(246, 244, 239, .66); --faint: rgba(246, 244, 239, .28);
  --red: #ff3b30; --amber: #ffb340; --shade: rgba(0, 0, 0, .55);
  --font-head: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; background: var(--black); }
body { background: var(--black); color: var(--white); font-family: var(--font-head); overflow-x: hidden; }
a { color: inherit; }
button { font-family: var(--font-head); cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* Heads-up display */
.hud { position: fixed; z-index: 20; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.hud > * { pointer-events: auto; }
.radio { display: flex; gap: 8px; align-items: baseline; font-family: var(--font-mono); background: rgba(0,0,0,.6); border-radius: 4px; padding: 6px 10px 5px; backdrop-filter: blur(6px); }
.radio .t { color: var(--red); font-size: 22px; font-weight: 600; letter-spacing: .03em; }
.radio .d { color: var(--dim); font-size: 12px; letter-spacing: .1em; }
.hud-r { display: flex; gap: 8px; align-items: center; }
.gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(7,7,7,.86); backdrop-filter: blur(8px); text-align: center; padding: 24px 16px; }
.gate[hidden] { display: none; }
.gate .in { display: grid; gap: 18px; justify-items: center; max-width: 520px; }
.gate .k { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin: 0; }
.gate .go { display: inline-flex; align-items: center; gap: 14px; border: 0; border-radius: 999px; background: var(--white); color: var(--black); font-size: clamp(22px, 5vw, 34px); font-weight: 900; padding: 22px 40px; letter-spacing: -.01em; box-shadow: 0 0 0 0 rgba(246,244,239,.5); animation: pulse 1.8s ease-out infinite; }
.gate .go svg { width: 1.2em; height: 1.2em; }
.gate .quiet { background: none; border: 0; color: var(--dim); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(246,244,239,.45); } 100% { box-shadow: 0 0 0 26px rgba(246,244,239,0); } }
@media (prefers-reduced-motion: reduce) { .gate .go { animation: none; } }
.pill { border: 1px solid var(--faint); background: rgba(0,0,0,.6); color: var(--white); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; backdrop-filter: blur(6px); }
.pill.on { background: var(--white); color: var(--black); }
.dots { position: fixed; z-index: 20; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
.dots a { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: block; }
.dots a.on { background: var(--red); transform: scale(1.4); }
@media (max-width: 600px) { .dots { display: none; } }

/* Scenes */
.scene { position: relative; height: 100vh; height: 100svh; min-height: 480px; scroll-snap-align: start; overflow: hidden; background: var(--black); }
.media { position: absolute; inset: 0; overflow: hidden; background: #000; }
.media video, .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media img { opacity: 0; }
.media img.on { opacity: 1; }
.media .grade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 58%, rgba(0,0,0,.8) 100%); }
.label { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 3; display: flex; flex-direction: column; gap: 4px; }
.label .k { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
.label .w { font-size: clamp(15px, 1.6vw, 20px); font-weight: 800; line-height: 1.2; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
.label .q { font-size: clamp(16px, 1.9vw, 24px); font-style: italic; font-weight: 800; line-height: 1.2; max-width: 34ch; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
.label .s { font-size: 11px; color: var(--dim); }
.label .s a { color: var(--dim); }
.stub { position: absolute; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 60px); left: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--black); background: var(--amber); padding: 2px 6px; border-radius: 2px; }

/* Split layout: two screens side by side (stacked on tall screens). One side plays while the other
   waits, dimmed; then they swap. The playing side widens a little. */
.split .media { transition: left .7s cubic-bezier(.3,.8,.2,1), right .7s cubic-bezier(.3,.8,.2,1), top .7s cubic-bezier(.3,.8,.2,1), bottom .7s cubic-bezier(.3,.8,.2,1); }
.split .media.a { right: 50%; }
.split .media.b { left: 50%; }
.split.play-a .media.a { right: 40%; } .split.play-a .media.b { left: 60%; }
.split.play-b .media.a { right: 60%; } .split.play-b .media.b { left: 40%; }
.split .media video, .split .media img { transition: filter .7s; }
.split.play-a .media.b video, .split.play-a .media.b img, .split.play-b .media.a video, .split.play-b .media.a img { filter: grayscale(1) brightness(.32); }
.split .media .label { transition: opacity .7s; }
.split.play-a .media.b .label, .split.play-b .media.a .label { opacity: .3; }
.split .seam { position: absolute; z-index: 2; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--black); transition: left .7s cubic-bezier(.3,.8,.2,1), top .7s cubic-bezier(.3,.8,.2,1); }
.split.play-a .seam { left: 60%; } .split.play-b .seam { left: 40%; }
.prog { position: absolute; z-index: 4; left: 0; bottom: 0; height: 3px; width: 0; background: var(--red); }
.split.play-a .media.b .prog, .split.play-b .media.a .prog { opacity: 0; }
@media (max-aspect-ratio: 1/1) {
  .split .media.a { right: 0; bottom: 50%; } .split .media.b { left: 0; top: 50%; }
  .split.play-a .media.a { right: 0; bottom: 40%; } .split.play-a .media.b { left: 0; top: 60%; }
  .split.play-b .media.a { right: 0; bottom: 60%; } .split.play-b .media.b { left: 0; top: 40%; }
  .split .seam, .split.play-a .seam, .split.play-b .seam { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 3px; margin: -1.5px 0 0; }
  .split.play-a .seam { top: 60%; } .split.play-b .seam { top: 40%; }
  .split .media.a .label { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 60px); }
}
@media (max-width: 600px) { .finale .pip .label { display: none; } }

/* Big overlaid type */
.over { position: absolute; z-index: 6; pointer-events: none; padding: 0 20px; }
.over.center { inset: 0; display: grid; place-content: center; text-align: center; }
.over.top { left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 70px); }
.over .kick { font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin: 0 0 10px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.over h2 { margin: 0 auto; font-weight: 900; font-size: clamp(34px, 7.2vw, 108px); line-height: .92; letter-spacing: -.03em; text-transform: uppercase; max-width: 15ch; text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.65); }
.over.top h2 { margin: 0; }
.over p.sub { font-size: clamp(16px, 1.8vw, 22px); font-weight: 700; max-width: 36ch; margin: 14px auto 0; line-height: 1.3; text-shadow: 0 1px 14px rgba(0,0,0,.8); }
.over.top p.sub { margin-left: 0; }
.scene.enter .over h2 { animation: punch .7s cubic-bezier(.2,.9,.2,1) both; }
.split.enter .over { animation: titlecard 4.2s ease-in forwards; }
@keyframes titlecard { 0%, 72% { opacity: 1; } 100% { opacity: 0; } }
@keyframes punch { from { opacity: 0; transform: scale(1.08); letter-spacing: .02em; } to { opacity: 1; transform: none; } }
.scene.enter .rewind { animation: rewind .45s steps(6) both; }
.rewind { position: absolute; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.09) 0 2px, transparent 2px 5px); mix-blend-mode: screen; }
@keyframes rewind { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

/* Opening */
.open { display: grid; place-content: center; text-align: center; padding: 0 20px; }
.open .clock { font-family: var(--font-mono); font-weight: 600; color: var(--red); font-size: clamp(90px, 22vw, 260px); line-height: 1; letter-spacing: .02em; text-shadow: 0 0 40px rgba(255,59,48,.35); }
.open .clock small { font-size: .2em; color: var(--dim); vertical-align: top; margin-left: .2em; }
.open h1 { margin: 26px auto 0; font-weight: 900; font-size: clamp(30px, 5.4vw, 72px); line-height: .95; letter-spacing: -.03em; text-transform: uppercase; max-width: 16ch; text-wrap: balance; }
.open .sub { margin: 18px auto 0; max-width: 40ch; color: var(--dim); font-size: clamp(15px, 1.6vw, 19px); line-height: 1.4; font-weight: 500; }
.open .cue { position: absolute; left: 0; right: 0; bottom: 28px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); animation: bob 2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(6px); } }

/* Finale: the loop */
.finale .media.b { inset: 0; }
.finale .pip { position: absolute; z-index: 4; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 64px); width: min(34vw, 380px); aspect-ratio: 16 / 9; border: 2px solid var(--white); border-radius: 3px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.finale .pip .media { inset: 0; }
.finale .pip .label { left: 8px; bottom: 6px; }
.finale .pip .label .w { font-size: 12px; }
.finale .pip .label .q, .finale .pip .label .s { display: none; }
.loopbox { position: absolute; z-index: 6; left: 16px; bottom: 16px; width: min(560px, calc(100% - 32px)); background: rgba(5,5,5,.78); backdrop-filter: blur(8px); border: 1px solid var(--faint); border-radius: 6px; padding: 16px 18px 14px; }
.loopbox .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.loopbox .day { font-family: var(--font-mono); font-weight: 600; color: var(--red); font-size: clamp(40px, 6vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; }
.loopbox .day small { display: block; font-size: 11px; letter-spacing: .14em; color: var(--dim); font-family: var(--font-head); font-weight: 700; margin-top: 4px; }
.loopbox .odds { font-size: 13px; color: var(--dim); line-height: 1.35; flex: 1; min-width: 180px; }
.loopbox .odds b { color: var(--white); font-size: 22px; font-weight: 900; display: block; }
.loopbox .msg { font-size: 15px; font-weight: 700; line-height: 1.35; min-height: 2.7em; margin: 10px 0 10px; }
.loopbox .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.loopbox button { border: 1.5px solid var(--white); background: transparent; color: var(--white); border-radius: 3px; padding: 8px 12px; font-size: 13px; font-weight: 800; }
.loopbox button.primary { background: var(--white); color: var(--black); }
.loopbox button:disabled { opacity: .4; cursor: default; }
.loopbox svg { display: block; width: 100%; margin-top: 12px; overflow: visible; }
.loopbox svg text { font-family: var(--font-head); fill: var(--dim); font-size: 10.5px; }
.stamp { position: absolute; z-index: 5; inset: 0; display: grid; place-content: center; pointer-events: none; opacity: 0; }
.stamp span { font-weight: 900; font-size: clamp(60px, 14vw, 200px); letter-spacing: -.03em; color: var(--white); text-transform: uppercase; border: .06em solid var(--white); padding: 0 .2em; transform: rotate(-6deg); text-shadow: 0 0 30px rgba(0,0,0,.5); }
.stamp.win span { color: var(--red); border-color: var(--red); }
.stamp.show { opacity: 1; }
@media (max-width: 600px) { .finale .pip { width: 44vw; } .loopbox { padding: 12px 14px; } .loopbox svg { display: none; } }

/* Credits roll */
.credits { height: auto; min-height: 100svh; padding: 90px 16px 80px; scroll-snap-align: start; }
.credits .inner { max-width: 640px; margin: 0 auto; text-align: center; }
.credits h3 { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin: 34px 0 10px; }
.credits p, .credits li { font-size: 14px; line-height: 1.55; color: var(--dim); font-weight: 500; }
.credits ul { list-style: none; padding: 0; margin: 0; }
.credits li { margin-bottom: 6px; }
.credits .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.credits .links a { border: 1px solid var(--faint); border-radius: 999px; padding: 7px 14px; text-decoration: none; font-size: 13px; font-weight: 700; color: var(--white); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Sound">
  <div class="in"><p class="k">This film has sound</p>
  <button class="go" id="gateOn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>Turn on sound</button>
  <button class="quiet" id="gateOff" type="button">Watch muted</button></div>
</div>
<div class="hud">
  <div class="radio" aria-label="Clock radio"><span class="t" id="hudTime">6:00</span><span class="d" id="hudDay">DAY 0001</span></div>
  <div class="hud-r"><button class="pill" id="soundBtn" type="button" aria-pressed="false">Sound off</button><button class="pill" id="pauseBtn" type="button">Pause</button></div>
</div>

<script>
/* ===== CONTENT: Sam edits everything in this block. Empty strings hide a line. =====
   layout: "split" (the film plays, then the Trump clip, side by side) or "finale".
   hold: seconds each side shows when it has no video yet (default 6).
   file: a video published beside the page, e.g. "clips/ex1-film.mp4". Until a file exists the scene
   falls back to YouTube's four preview frames for the clip named by yt. */
const CONTENT = {
  open: {
    title: "Is Donald Trump living the same day over and over?",
    sub: "",
    cue: "Scroll to wake up"
  },
  scenes: [
    { id: "rules", layout: "split", kicker: "Exhibit 1", title: "The rules don't apply", sub: "", pos: "center",
      film:  { file: "clips/rules-film.mp4",  yt: "50jZVcRgkno", tag: "Groundhog Day, 1993", who: "Phil Connors (Bill Murray)", quote: "I'm not going to live by their rules anymore!", credit: "Columbia Pictures, 1993" },
      trump: { file: "clips/rules-trump.mp4", yt: "Iimj0j4NYME", tag: "NATO, Brussels, May 25, 2017", who: "Trump pushes past Montenegro's prime minister", quote: "", credit: "MSNBC, via the Internet Archive TV News Archive" } },
    { id: "consequences", layout: "split", kicker: "Exhibit 2", title: "No consequences", sub: "", pos: "center",
      film:  { file: "clips/consequences-film.mp4",  yt: "ZHpXxAW3p_o", tag: "Groundhog Day, 1993", who: "Phil Connors drives Gus and Ralph home", quote: "What if there were no tomorrow?", credit: "Columbia Pictures, 1993" },
      trump: { file: "clips/consequences-trump.mp4", yt: "iTACH1eVIaA", tag: "Sioux Center, Iowa, Jan. 23, 2016", who: "Trump at a rally at Dordt College", quote: "I could stand in the middle of Fifth Avenue and shoot somebody, and I wouldn't lose any voters.", credit: "CNN, via the Internet Archive TV News Archive" } },
    { id: "ennui", layout: "split", kicker: "Exhibit 3", title: "Ennui", sub: "", pos: "center",
      film:  { file: "clips/ennui-film.mp4",  yt: "vBeGQAvabOE", tag: "Groundhog Day, 1993", who: "Phil's forecast from Gobbler's Knob", quote: "It's gonna last you for the rest of your life.", credit: "Columbia Pictures, 1993" },
      trump: { file: "clips/ennui-trump.mp4", yt: "OgAKS23TCXY", tag: "Oaks, Pa., Oct. 14, 2024", who: "Trump sways to music on stage for 39 minutes", quote: "Let's just listen to music.", credit: "C-SPAN, via the Internet Archive TV News Archive" } },
    { id: "lines", layout: "split", kicker: "Exhibit 4", title: "Same day, same lines", sub: "", pos: "center",
      film:  { file: "clips/lines-film.mp4",  yt: "XqSYC_vwhDg", tag: "Groundhog Day, 1993", who: "Ned Ryerson (Stephen Tobolowsky) greets Phil, every morning", quote: "Phil? Phil Connors? I thought that was you!", credit: "Columbia Pictures, 1993" },
      trump: { file: "clips/lines-trump.mp4", yt: "bqbmTnr9NSE", tag: "Four rallies, 2023 to 2024", who: "The same riff about sharks and electric boats, in Anaheim, Ankeny, Las Vegas and Grand Rapids", quote: "I'll take electrocution every time.", credit: "C-SPAN, via the Internet Archive TV News Archive" } },
    { id: "butler", layout: "finale", kicker: "Exhibit 5", title: "Again. Again. Again.", sub: "", pos: "top",
      film:  { file: "clips/butler-film.mp4",  yt: "z1bVCdT5kso", tag: "Edge of Tomorrow, 2014", who: "Training: Cage (Tom Cruise) is shot, wakes and tries again", quote: "", credit: "Warner Bros., 2014" },
      trump: { file: "clips/butler-trump.mp4", yt: "LAk6dXEzIUo", tag: "Butler, Pa., July 13, 2024", who: "The RSBN broadcast of Trump's rally", quote: "", credit: "RSBN broadcast, via the Internet Archive", crack: 10.0 } },
    { id: "reaction", layout: "split", kicker: "Exhibit 6", title: "Death holds no fear", sub: "", pos: "center",
      film:  { file: "clips/reaction-film.mp4",  yt: "7FS56uRsnjo", tag: "Palm Springs, 2020", who: "Nyles (Andy Samberg) takes an arrow, then lies back on his float", quote: "It's one of those infinite time loop situations you might have heard about.", credit: "Hulu and Neon, 2020" },
      trump: { file: "clips/reaction-trump.mp4", yt: "LAk6dXEzIUo", tag: "Butler, Pa., July 13, 2024", who: "About a minute after the shot, Trump rises and raises his fist", quote: "Fight! Fight! Fight!", credit: "RSBN broadcast, via the Internet Archive" } }
  ],
  finale: {
    once: "Live July 13 again",
    run: "Loop until it works",
    reset: "New Trump",
    start: "One head-aimed shot, fired at a random moment of the speech. Press to live the day.",
    fail: "Not the ear. The day resets.",
    win: "The bullet clips his ear and nothing else."
  }
};
/* ===== END CONTENT ===== */

const FRAMES = __FRAMES__;
const P = 1 / 990;  // Butler project headline: ear-only hit at a random moment of the speech (results/RESULTS.md).
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const film = document.getElementById("film"), dots = document.getElementById("dots");
const players = [];  // { scene, v (video or null), frames, side }
let paused = false, current = -1;

function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function media(c, cls, scene, side) {
  const m = document.createElement("div"); m.className = "media " + cls;
  const keys = ["hqdefault", "hq1", "hq2", "hq3"];
  const imgs = keys.map((k, i) => { const im = new Image(); im.alt = ""; im.src = FRAMES[c.yt + "_" + k] || ""; if (!i) im.className = "on"; m.appendChild(im); return im; });
  const p = { scene, side, v: null, imgs, i: 0, stub: null };
  const v = document.createElement("video"); v.muted = true; v.loop = false; v.playsInline = true; v.preload = "metadata"; v.setAttribute("playsinline", "");
  v.addEventListener("loadeddata", () => { p.v = v; imgs.forEach(im => im.remove()); p.stub && p.stub.remove(); });
  v.addEventListener("error", () => { v.remove(); }, true);
  const s = document.createElement("source"); s.src = c.file; s.type = "video/mp4";
  s.addEventListener("error", () => { v.remove(); });
  v.appendChild(s); m.prepend(v);
  m.insertAdjacentHTML("beforeend", `<div class="grade"></div><div class="label">${c.tag ? `<span class="k">${esc(c.tag)}</span>` : ""}${c.who ? `<span class="w">${esc(c.who)}</span>` : ""}${c.quote ? `<span class="q">“${esc(c.quote)}”</span>` : ""}<span class="s">${esc(c.credit)} · <a href="https://www.youtube.com/watch?v=${c.yt}" target="_blank" rel="noopener">source clip</a></span></div>`);
  p.prog = document.createElement("div"); p.prog.className = "prog"; m.appendChild(p.prog);
  v.addEventListener("ended", () => { if (scene.onEnded) scene.onEnded(p); });
  p.vEl = v; players.push(p); return m;
}
// Sound is on by default, but browsers allow it only after a click, so the page opens on one big prompt.
let sound = false;
const soundBtn = document.getElementById("soundBtn");
function setSound(on) {
  sound = on; soundBtn.textContent = on ? "Sound on" : "Sound off"; soundBtn.classList.toggle("on", on); soundBtn.setAttribute("aria-pressed", on);
  players.forEach(q => { if (!q.vEl) return; q.vEl.muted = !(on && q.active); if (on && q.active && !paused && sections[current] === q.scene) q.vEl.play().catch(() => {}); });
}
soundBtn.addEventListener("click", () => setSound(!sound));
const gate = document.getElementById("gate");
// Safari and strict browsers unlock sound one video at a time, so the click starts and stops each clip once.
function unlockAll() {
  players.forEach(q => { const v = q.vEl; if (!v) return; const live = q.active && !paused && sections[current] === q.scene;
    v.muted = false; const pr = v.play(); if (pr) pr.then(() => { if (!live) { v.pause(); v.currentTime = 0; } v.muted = !(sound && q.active); }).catch(() => {}); });
}
document.getElementById("gateOn").addEventListener("click", () => { gate.hidden = true; sound = true; unlockAll(); setSound(true); });
document.getElementById("gateOff").addEventListener("click", () => { gate.hidden = true; });
document.getElementById("gateOn").focus();
function overlay(sc) {
  return `<div class="over ${sc.pos || "center"}">${sc.kicker ? `<p class="kick">${esc(sc.kicker)}</p>` : ""}${sc.title ? `<h2>${esc(sc.title)}</h2>` : ""}${sc.sub ? `<p class="sub">${esc(sc.sub)}</p>` : ""}</div><div class="rewind"></div>`;
}


// One side plays, then the other, then the film again. A side without video holds its preview frames.
function sequencer(s, sc) {
  const [pa, pb] = players.filter(p => p.scene === s);
  let side = null, t0 = 0;
  s.go = which => {
    side = which; t0 = performance.now();
    s.classList.toggle("play-a", which === "a"); s.classList.toggle("play-b", which === "b");
    [pa, pb].forEach(p => {
      p.active = (p === (which === "a" ? pa : pb));
      if (!p.vEl) return;
      p.vEl.muted = !(sound && p.active);
      if (p.active) { p.vEl.currentTime = 0; if (!paused) p.vEl.play().catch(() => {}); } else p.vEl.pause();
    });
  };
  s.onEnded = p => { if (p.active && side) s.go(side === "a" ? "b" : "a"); };
  s.start = () => s.go("a");
  s.stop = () => { [pa, pb].forEach(p => { p.active = false; if (p.vEl) p.vEl.pause(); }); side = null; };
  s.tick = now => {
    if (!side || paused) return;
    const p = side === "a" ? pa : pb, hold = (sc.hold || 6) * 1000;
    if (p.v) { const d = p.vEl.duration || 1; p.prog.style.width = (p.vEl.currentTime / d * 100) + "%"; }
    else { p.prog.style.width = Math.min(100, (now - t0) / hold * 100) + "%"; if (now - t0 > hold) s.go(side === "a" ? "b" : "a"); }
  };
}

// The piece opens with the teaser (00-teaser), so this page starts straight on its first exhibit (Sam, Oct 15: one continuous page).
const sections = [];
CONTENT.scenes.forEach((sc, idx) => {
  const s = document.createElement("section"); s.className = "scene " + sc.layout; s.id = sc.id; s.dataset.idx = idx + 1;
  if (sc.layout === "finale") {
    s.appendChild(media(sc.trump, "b", s, "trump"));
    const pip = document.createElement("div"); pip.className = "pip"; pip.appendChild(media(sc.film, "a", s, "film")); s.appendChild(pip); const pv = pip.querySelector("video"); if (pv) pv.loop = true;  // the training montage loops under every relived day
    s.insertAdjacentHTML("beforeend", overlay(sc) + `<div class="stamp" id="stamp"><span>Reset</span></div>
      <div class="loopbox"><div class="row"><div class="day" id="loopDay">0001<small>JULY 13 NUMBER</small></div>
      <div class="odds"><b>1 in 990</b>chance that one shot at a random moment of the speech hits only his ear. Even odds of a hit like that take about 690 tries.</div></div>
      <div class="msg" id="loopMsg" aria-live="polite">${esc(CONTENT.finale.start)}</div>
      <div class="btns"><button class="primary" id="once" type="button">${esc(CONTENT.finale.once)}</button><button id="run" type="button">${esc(CONTENT.finale.run)}</button><button id="reset" type="button">${esc(CONTENT.finale.reset)}</button></div>
      <svg id="loopChart" viewBox="0 0 520 96" aria-label="Chance of at least one ear-only day by number of tries"></svg></div>`);
  } else {
    s.appendChild(media(sc.film, "a", s, "film"));
    s.appendChild(media(sc.trump, "b", s, "trump"));
    s.insertAdjacentHTML("beforeend", `<div class="seam"></div>`);
    sequencer(s, sc);
    s.insertAdjacentHTML("beforeend", overlay(sc));
  }
  film.appendChild(s); sections.push(s);
});

// Credits roll
const credits = document.createElement("section"); credits.className = "scene credits"; credits.id = "credits";
credits.innerHTML = `<div class="inner"><h3>The Butler analysis</h3><div class="links">
  <a href="https://claude.ai/artifact/JGEfKhHho4XZzHSed5YfBg" target="_blank" rel="noopener">Only the Ear</a>
  <a href="https://claude.ai/artifact/5WaijmmetS7uG2dVGBsheb" target="_blank" rel="noopener">The Turn</a>
  <a href="https://claude.ai/artifact/97TVEKUAy91vTmbmpXCyzn" target="_blank" rel="noopener">Moving Target</a>
  <a href="https://claude.ai/artifact/6mqn5mzxwPv78qwL8KAzJh" target="_blank" rel="noopener">The Bump</a></div>
  <h3>The odds</h3><p>The 1-in-990 figure comes from the Butler project's simulation of Thomas Crooks's first shot: one head-aimed shot at a random moment of Trump's speech, with his head turning as the RSBN broadcast shows. The page adds one calculation, the chance of at least one ear-only day in N tries, 1 − (1 − 1/990)<sup>N</sup>.</p>
  <h3>Clips</h3><ul id="clipList"></ul>
  <p style="margin-top:22px">Clips are shown for commentary in a personal, non-commercial project and belong to their owners. Where a clip has not been supplied yet, the scene shows the four preview frames YouTube makes for it.</p></div>`;
film.appendChild(credits); sections.push(credits);
CONTENT.scenes.forEach(sc => [sc.film, sc.trump].forEach(c => document.getElementById("clipList").insertAdjacentHTML("beforeend", `<li>${esc(c.tag)}: ${esc(c.credit)} · <a href="https://www.youtube.com/watch?v=${c.yt}" target="_blank" rel="noopener">youtube.com/watch?v=${c.yt}</a></li>`)));

sections.forEach((s, i) => dots.insertAdjacentHTML("beforeend", `<a href="#${s.id}" aria-label="Scene ${i + 1}"></a>`));
const dotEls = [...dots.children];

// Play only the scene on screen; the HUD day counter follows the scene.
const io = new IntersectionObserver(es => es.forEach(en => {
  const i = sections.indexOf(en.target);
  if (en.isIntersecting) {
    current = i; en.target.classList.remove("enter"); void en.target.offsetWidth; en.target.classList.add("enter");
    dotEls.forEach((d, j) => d.classList.toggle("on", j === i));
    document.getElementById("hudDay").textContent = "DAY " + String(i + 1).padStart(4, "0");
  }
  const sc = en.target;
  if (sc.start) { if (en.isIntersecting) sc.start(); else sc.stop(); }
  else players.filter(p => p.scene === sc).forEach(p => { if (!p.vEl) return; if (en.isIntersecting && !paused) p.vEl.play().catch(() => {}); else p.vEl.pause(); });
}), { threshold: 0.6 });
sections.forEach(s => io.observe(s));

// Flip-book fallback and sequencer clock
setInterval(() => { if (paused) return; players.forEach(p => { if (p.v || !p.imgs.length || sections[current] !== p.scene) return; p.imgs[p.i].classList.remove("on"); p.i = (p.i + 1) % 4; p.imgs[p.i].classList.add("on"); }); }, 1000);
(function tick(t) { const s = sections[current]; if (s && s.tick) s.tick(t); requestAnimationFrame(tick); })(0);

document.getElementById("pauseBtn").addEventListener("click", e => {
  paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; e.target.classList.toggle("on", paused);
  players.forEach(p => { if (!p.vEl) return; if (paused) p.vEl.pause(); else if (sections[current] === p.scene && (p.active || !p.scene.start)) p.vEl.play().catch(() => {}); });
});

// Finale: relive July 13 until the ear-only day. Its two clips loop on their own.
players.filter(p => p.scene.classList.contains("finale")).forEach(p => { p.vEl.loop = true; });
const FIN = CONTENT.scenes.find(s => s.layout === "finale");
const fp = players.find(p => p.side === "trump" && p.scene.classList.contains("finale"));
if (fp) fp.active = true;  // the full-screen Butler clip carries the sound; the inset stays muted
const pipP = players.find(p => p.side === "film" && p.scene.classList.contains("finale"));
let day = 0, done = false, timer = null; const runs = [];
const dayEl = document.getElementById("loopDay"), msg = document.getElementById("loopMsg"), stamp = document.getElementById("stamp");
const pad = n => String(n).padStart(4, "0");
function flash(win) {
  stamp.classList.toggle("win", win); stamp.querySelector("span").textContent = win ? "Day " + day.toLocaleString() : "Reset";
  stamp.classList.add("show"); clearTimeout(flash.t); flash.t = setTimeout(() => stamp.classList.remove("show"), win ? 2600 : 260);
}
function rewindClips() { [fp, pipP].forEach(p => { if (p && p.vEl && p.v) { p.vEl.currentTime = 0; p.vEl.play().catch(() => {}); } }); }
function liveOne(fast) {
  day++; dayEl.firstChild.nodeValue = pad(day);
  if (Math.random() < P) {
    done = true; runs.push(day); stopRun();
    msg.innerHTML = `<b>${esc(CONTENT.finale.win)}</b> Day ${day.toLocaleString()}. ${day <= 690 ? "An early escape: fewer than half of looped Trumps get out this fast." : day <= 2280 ? "A typical wait for a looped Trump." : "A long sentence: fewer than one looped Trump in ten waits this long."}`;
    flash(true);
    if (fp && fp.v) { fp.vEl.currentTime = Math.max(0, (FIN.trump.crack || 0) - 4); fp.vEl.play().catch(() => {}); }
    document.getElementById("once").disabled = document.getElementById("run").disabled = true; chart(); return true;
  }
  if (!fast) { msg.textContent = `Day ${day.toLocaleString()}. ${CONTENT.finale.fail}`; flash(false); rewindClips(); }
  return false;
}
function stopRun() { if (timer) { clearInterval(timer); timer = null; document.getElementById("run").textContent = CONTENT.finale.run; } }
document.getElementById("once").addEventListener("click", () => { if (!done) { liveOne(false); chart(); } });
document.getElementById("run").addEventListener("click", e => {
  if (timer) { stopRun(); return; }
  e.target.textContent = "Stop";
  timer = setInterval(() => { for (let k = 0; k < (reduce ? 60 : 4); k++) if (liveOne(true)) return; msg.textContent = `Day ${day.toLocaleString()}. ${CONTENT.finale.fail}`; flash(false); rewindClips(); chart(); }, 90);
});
document.getElementById("reset").addEventListener("click", () => {
  stopRun(); day = 0; done = false; dayEl.firstChild.nodeValue = pad(1); msg.textContent = CONTENT.finale.start;
  document.getElementById("once").disabled = document.getElementById("run").disabled = false; chart(); rewindClips();
});
function chart() {
  const svg = document.getElementById("loopChart"), W = 520, H = 96, l = 26, r = 8, t = 8, b = 20, X = 3000;
  const xs = n => l + n / X * (W - l - r), ys = v => t + (1 - v) * (H - t - b), cum = n => 1 - Math.pow(1 - P, n);
  let d = ""; for (let n = 0; n <= X; n += 20) d += (n ? "L" : "M") + xs(n).toFixed(1) + "," + ys(cum(n)).toFixed(1);
  let h = `<line x1="${l}" x2="${W - r}" y1="${ys(0)}" y2="${ys(0)}" stroke="rgba(246,244,239,.35)"/><line x1="${l}" x2="${W - r}" y1="${ys(.5)}" y2="${ys(.5)}" stroke="rgba(246,244,239,.12)"/>
    <text x="${l - 4}" y="${ys(0) + 3}" text-anchor="end">0</text><text x="${l - 4}" y="${ys(.5) + 3}" text-anchor="end">50%</text><text x="${l - 4}" y="${ys(1) + 3}" text-anchor="end">100%</text>
    <text x="${W - r}" y="${H - 4}" text-anchor="end">3,000 tries</text><text x="${xs(690)}" y="${H - 4}" text-anchor="middle">690</text>
    <line x1="${xs(690)}" x2="${xs(690)}" y1="${ys(.5)}" y2="${ys(0)}" stroke="rgba(246,244,239,.4)" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="#ff3b30" stroke-width="2"/>`;
  runs.forEach((n, i) => { const x = xs(Math.min(n, X)); h += `<line x1="${x}" x2="${x}" y1="${ys(0) - 6}" y2="${ys(0) + 6}" stroke="${i === runs.length - 1 ? "#f6f4ef" : "rgba(246,244,239,.45)"}" stroke-width="${i === runs.length - 1 ? 2.5 : 1.5}" stroke-linecap="round"/>`; });
  if (!done && day) h += `<line x1="${xs(Math.min(day, X))}" x2="${xs(Math.min(day, X))}" y1="${ys(1)}" y2="${ys(0)}" stroke="#ffb340" stroke-width="1"/>`;
  svg.innerHTML = h;
}
chart();
</script>
