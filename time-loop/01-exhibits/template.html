   with one line on it. Single dark world by choice. */
:root {
  /* The piece's shared tokens (assembly/tokens.css), repeated here so the page also works on its own. */
  --night: #0b0d10; --ink-on-night: #f3efe6; --dim-on-night: #b4afa4; --rule-on-night: rgba(243, 239, 230, .24); --led: #ff3b2f;

  /* this page's names for them */
  --black: var(--night); --white: var(--ink-on-night); --dim: var(--dim-on-night); --faint: var(--rule-on-night);
  --red: var(--led); --amber: var(--ink-on-night); --shade: rgba(0, 0, 0, .55);
  --font-mono: var(--font-clock);

}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; background: var(--black); }

.pill.on { background: var(--white); color: var(--black); }

/* Inside the 6:11 p.m. spine (assembly/CONTRACT.md) */

.split .media { transition: left .35s cubic-bezier(.3,.8,.2,1), right .35s cubic-bezier(.3,.8,.2,1), top .35s cubic-bezier(.3,.8,.2,1), bottom .35s cubic-bezier(.3,.8,.2,1), opacity .35s; }
.split .media.b { opacity: 0; }
.split.play-b .media.a { opacity: 0; } .split.play-b .media.b { opacity: 1; }
.split.beat .media.a { right: 50%; opacity: 1; } .split.beat .media.b { left: 50%; opacity: 1; }
.split .media .label, .split .media .grade { opacity: 0; }
.split.play-a:not(.beat):not(.titling) .media.a .label, .split.play-a:not(.beat):not(.titling) .media.a .grade,
.split.play-b:not(.beat) .media.b .label, .split.play-b:not(.beat) .media.b .grade { opacity: 1; }

const players = [];  // { scene, v (video or null), frames, side }
let paused = false, current = -1, userPaused = false, away = false;  // paused = the reader paused, or the spine has moved on (away)

function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function media(c, cls, scene, side) {
  const m = document.createElement("div"); m.className = "media " + cls;
  const p = { scene, side, v: null };
  const v = document.createElement("video"); v.muted = true; v.loop = false; v.playsInline = true; v.preload = "metadata"; v.setAttribute("playsinline", "");
  v.poster = c.file.replace("clips/", "posters/").replace(/\.mp4$/, ".jpg");  // the clip's first frame while it loads
  if (c.pos) v.style.objectPosition = c.pos;
  p.endAt = c.endAt;
  v.addEventListener("loadeddata", () => { p.v = v; m.classList.add("ready"); });
  v.addEventListener("canplay", () => m.classList.add("ready"));
  v.addEventListener("waiting", () => { if (p.active) m.classList.remove("ready"); });
  v.addEventListener("playing", () => m.classList.add("ready"));
  const s = document.createElement("source"); s.src = c.file; s.type = "video/mp4";
  s.addEventListener("error", () => m.classList.add("ready"));  // no clip: the still holds for the scene's hold time
  v.appendChild(s); m.prepend(v);
  m.insertAdjacentHTML("beforeend", `<div class="load"><i></i>Loading</div>`);
  const line = c.quote ? `<span class="q">“${esc(c.quote)}”</span>` : c.desc ? `<span class="q desc">${esc(c.desc)}</span>` : "";
  m.insertAdjacentHTML("beforeend", `<div class="grade"></div><div class="label">${line}${c.att ? `<span class="att">${esc(c.att)}</span>` : ""}</div>`);
  v.addEventListener("ended", () => { if (scene.onEnded) scene.onEnded(p); });
  p.vEl = v; players.push(p); return m;
}
// Sound is on by default, but browsers allow it only after a click, so the page opens on one big prompt.
let sound = false;
const soundBtn = document.getElementById("soundBtn");
function setSound(on) {
  sound = on; soundBtn.textContent = on ? "Mute sound" : "Turn on sound"; soundBtn.classList.toggle("on", on); soundBtn.setAttribute("aria-pressed", on);
  players.forEach(q => { if (!q.vEl) return; q.vEl.muted = !(on && q.active); if (on && q.active && !paused && sections[current] === q.scene) q.vEl.play().catch(() => {}); });
}
soundBtn.addEventListener("click", () => setSound(!sound));
const gate = document.getElementById("gate");
// Safari and strict browsers unlock sound one video at a time, so the click starts and stops each clip once.
function unlockAll() {
  players.forEach(q => { const v = q.vEl; if (!v) return; const live = q.active && !paused && sections[current] === q.scene;
    v.muted = false; const pr = v.play(); if (pr) pr.then(() => { if (!live) { v.pause(); v.currentTime = 0; } v.muted = !(sound && q.active); }).catch(() => {}); });
}
document.getElementById("gateOn").addEventListener("click", () => { gate.hidden = true; sound = true; unlockAll(); setSound(true); });
document.getElementById("gateOff").addEventListener("click", () => { gate.hidden = true; });
if (!(window.Spine && Spine.embedded)) document.getElementById("gateOn").focus();
function overlay(sc) {
  return `<div class="over ${sc.pos || "center"}">${sc.title ? `<h2>${esc(sc.title)}</h2>` : ""}${sc.sub ? `<p class="sub">${esc(sc.sub)}</p>` : ""}</div>`;
}


// The title holds alone on the film's first frame, then the film plays full screen, a short side-by-side
// beat, the Trump clip full screen, a beat, and the film again. A side without video holds its preview frames.
// Timers count only while playing (el, in ms), so a pause holds the title or the beat where it is.
function warm(p) { if (p.vEl && p.vEl.preload !== "auto") { p.vEl.preload = "auto"; p.vEl.load(); } }
function sequencer(s, sc) {
  const [pa, pb] = players.filter(p => p.scene === s);
  let phase = null, el = 0, next = null;
  const set = (cls) => { s.classList.toggle("titling", cls === "title"); s.classList.toggle("beat", cls === "beat"); };
  s.go = which => {
    phase = which; el = 0; set(which);
    s.classList.toggle("play-a", which === "a"); s.classList.toggle("play-b", which === "b");
    [pa, pb].forEach(p => {
      p.active = (p === (which === "a" ? pa : pb));
      if (!p.vEl) return;
      p.vEl.muted = !(sound && p.active);
      if (p.active) { p.vEl.currentTime = 0; if (!paused) p.vEl.play().catch(() => {}); } else p.vEl.pause();
    });
  };
  const beat = to => {  // both sides on their last and first frames, side by side, then the next side plays
    phase = "beat"; next = to; el = 0; set("beat");
    [pa, pb].forEach(p => { p.active = false; if (!p.vEl) return; p.vEl.pause(); if (p === (to === "a" ? pa : pb)) p.vEl.currentTime = 0; });
  };
  // Inside the spine the last exhibit ends on its final frame, a calm picture before the sources panel.
  s.onEnded = p => { if (!p.active || (phase !== "a" && phase !== "b")) return; if (phase === "b" && s.classList.contains("last")) { phase = null; return; } beat(phase === "a" ? "b" : "a"); };
  // The last exhibit must end on the fist (Sam). If its clip can't play here (a browser that blocks autoplay,
  // a clip that never loads), the still switches to the clip's last frame when its hold runs out.
  const endOn = p => { if (!p.v && p.vEl) { p.vEl.poster = p.vEl.poster.replace(/\.jpg$/, "-end.jpg"); p.vEl.parentNode.classList.add("ready"); } };
  // The film starts at once under the title, so something moves the moment the exhibit arrives (Sam, Oct 16:
  // "I'm worried they'll just scroll by because nothing happens"). The title lifts after TITLE ms.
  let tEl = -1;
  s.start = () => {
    [pa, pb].forEach(warm);
    const i = sections.indexOf(s); [1, 2].forEach(d => { const nx = sections[i + d]; if (nx) players.filter(q => q.scene === nx).forEach(warm); });  // and the next two exhibits'
    s.go("a"); s.classList.add("titling"); tEl = 0;
  };
  s.stop = () => { [pa, pb].forEach(p => { p.active = false; if (p.vEl) p.vEl.pause(); }); phase = null; tEl = -1; s.classList.remove("titling"); };
  s.tick = dt => {
    if (!phase || paused) return;
    el += dt;
    if (tEl >= 0) { if (pa.v && !pa.vEl.paused) tEl += dt; else if (!pa.v && el > 10000) tEl = TITLE + 1;  // the title counts only while the film plays
      if (tEl > TITLE) { tEl = -1; s.classList.remove("titling"); } }
    if (phase === "beat") { if (el > BEAT) s.go(next); return; }
    const p = phase === "a" ? pa : pb;
    if (phase === "b" && p.v && p.endAt && s.classList.contains("last") && p.vEl.currentTime >= p.endAt) { p.vEl.pause(); phase = null; return; }  // hold on the fist
    if (!p.v && tEl < 0 && el > (sc.hold || 6) * 1000) { if (phase === "b" && s.classList.contains("last")) { endOn(p); phase = null; return; } beat(phase === "a" ? "b" : "a"); }
  };
}

// The piece opens with the teaser (00-teaser), so this page starts straight on its first exhibit (Sam, Oct 15: one continuous page).
const sections = [];
CONTENT.scenes.forEach((sc, idx) => {
  const s = document.createElement("section"); s.className = "scene " + sc.layout; s.id = sc.id; s.dataset.idx = idx + 1;
  s.appendChild(media(sc.film, "a", s, "film"));
  s.appendChild(media(sc.trump, "b", s, "trump"));
  s.insertAdjacentHTML("beforeend", `<div class="seam"></div>`);
  sequencer(s, sc);
  s.insertAdjacentHTML("beforeend", overlay(sc));

  film.appendChild(s); sections.push(s);
});

// Credits roll
const credits = document.createElement("section"); credits.className = "scene credits"; credits.id = "credits";
credits.innerHTML = `<div class="inner"><div class="xlinks"><h3>The Butler analysis</h3><div class="links">
  <a href="https://claude.ai/artifact/JGEfKhHho4XZzHSed5YfBg" target="_blank" rel="noopener">Only the Ear</a>
  <a href="https://claude.ai/artifact/5WaijmmetS7uG2dVGBsheb" target="_blank" rel="noopener">The Margin</a>
  <a href="https://claude.ai/artifact/97TVEKUAy91vTmbmpXCyzn" target="_blank" rel="noopener">Moving Target</a>
  <a href="https://claude.ai/artifact/4WAhWVqreAhn28htr9EcpB" target="_blank" rel="noopener">The chart minute</a>
  <a href="https://claude.ai/artifact/6mqn5mzxwPv78qwL8KAzJh" target="_blank" rel="noopener">The Bump</a></div></div>
  <h3>Clips</h3><ul id="clipList"></ul>
  <p style="margin-top:22px">Clips are shown for commentary in a personal, non-commercial project and belong to their owners.</p></div>`;
film.appendChild(credits);
const inSpine = !!(window.Spine && Spine.embedded);
if (inSpine) sections[sections.length - 1].classList.add("last"); else sections.push(credits);
{ const seen = new Set();  // each source once (Butler and the fist share one broadcast)
  CONTENT.scenes.filter(sc => sc.film).forEach(sc => [sc.film, sc.trump].forEach(c => { const url = c.src || "https://www.youtube.com/watch?v=" + c.yt; if (seen.has(url)) return; seen.add(url);
    document.getElementById("clipList").insertAdjacentHTML("beforeend", `<li>${esc(c.tag)}: ${esc(c.credit)} · <a href="${url}" target="_blank" rel="noopener">${url.replace("https://", "")}</a></li>`); })); }

// Play only the scene on screen.
function show(sc, on) {
  const i = sections.indexOf(sc);
  if (on) {
    current = i;
  }
  if (sc.start) { if (on) sc.start(); else sc.stop(); }
  else players.filter(p => p.scene === sc).forEach(p => { if (!p.vEl) return; if (on && !paused) p.vEl.play().catch(() => {}); else p.vEl.pause(); });
}
if (window.Spine && Spine.embedded) {
  // Inside the spine the scenes stack: each holds still while the next slides up over it, so the one on screen
  // is the last whose top has passed 40% of the screen (covered scenes still count as visible to an observer).
  let on = -1;
  const pick = () => { let k = 0; sections.forEach((s, i) => { if (s.getBoundingClientRect().top < innerHeight * .4) k = i; });
    if (k !== on) { if (on >= 0) show(sections[on], false); on = k; show(sections[k], true); } };
  addEventListener("scroll", pick, { passive: true }); addEventListener("resize", pick); requestAnimationFrame(pick);
} else {
  const io = new IntersectionObserver(es => es.forEach(en => show(en.target, en.isIntersecting)), { threshold: 0.6 });
  sections.forEach(s => io.observe(s));
}

// Start fetching the first exhibit's clips as soon as the page loads (inside the joined page that is a few screens
// before the reader arrives), so the film is ready to move when they get there.
players.filter(p => p.scene === sections[0]).forEach(warm);

// Sequencer clock
{ let last = performance.now(); (function tick(t) { const dt = Math.min(100, t - last); last = t; const s = sections[current]; if (s && s.tick) s.tick(dt); requestAnimationFrame(tick); })(last); }

document.getElementById("pauseBtn").addEventListener("click", e => {
  userPaused = !userPaused; paused = userPaused || away; e.target.textContent = userPaused ? "Play" : "Pause"; e.target.classList.toggle("on", userPaused);
  players.forEach(p => { if (!p.vEl) return; if (paused) p.vEl.pause(); else if (sections[current] === p.scene && (p.active || !p.scene.start)) p.vEl.play().catch(() => {}); });
});

// Inside the 6:11 p.m. spine (assembly/CONTRACT.md): the spine asks about sound once for the whole piece
// and says when this section is on screen. Opened on its own, the page ignores all of this.
if (window.Spine && Spine.embedded) {
  gate.hidden = true; away = true; paused = true; setSound(Spine.sound);
  Spine.register({
    kind: "scroll",
    sound(on) { setSound(on); },
    unlock() { unlockAll(); },
    enter() {
      away = false; paused = userPaused; const s = sections[current]; if (!s || paused) return;
      if (s.start) s.start(); else players.filter(p => p.scene === s).forEach(p => { if (p.vEl) p.vEl.play().catch(() => {}); });
    },
    leave() { away = true; paused = true; sections.forEach(s => { if (s.stop) s.stop(); }); players.forEach(p => { if (p.vEl) p.vEl.pause(); }); }
  });
}
</script>
